apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: permission-aware-retrieval
  namespace: permission-aware-retrieval
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: permission-aware-retrieval}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
